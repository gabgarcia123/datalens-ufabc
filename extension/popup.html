<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>DataLens — Extensão Ativa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 365px;
      background: #09090B;
      color: #FAFAFA;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      padding: 14px;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: "JetBrains Mono", Consolas, ui-monospace, monospace; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272A;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      background: #0D9488;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
    }
    .brand-title { font-size: 13.5px; font-weight: 700; color: #FAFAFA; letter-spacing: -0.01em; }
    .brand-sub { font-size: 10.5px; color: #71717A; }
    .badge {
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-high { background: rgba(239,68,68,0.12); color: #EF4444; border: 1px solid rgba(239,68,68,0.3); }
    .badge-medium { background: rgba(245,158,11,0.12); color: #F59E0B; border: 1px solid rgba(245,158,11,0.3); }
    .badge-low { background: rgba(16,185,129,0.12); color: #10B981; border: 1px solid rgba(16,185,129,0.3); }

    .site-box {
      background: #121215;
      border: 1px solid #27272A;
      border-radius: 7px;
      padding: 11px 12px;
      margin-bottom: 10px;
    }
    .domain-name {
      font-size: 13.5px;
      font-weight: 700;
      color: #FAFAFA;
      word-break: break-all;
      margin-top: 2px;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
      text-align: center;
    }
    .metric-pill {
      background: #09090B;
      border: 1px solid #27272A;
      border-radius: 5px;
      padding: 6px 4px;
    }
    .metric-val { font-size: 13.5px; font-weight: 700; display: block; }
    .metric-lbl { font-size: 10px; color: #71717A; }

    .section-title {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      color: #71717A;
      margin-bottom: 5px;
      letter-spacing: 0.04em;
    }
    .items-list {
      list-style: none;
      background: #121215;
      border: 1px solid #27272A;
      border-radius: 7px;
      padding: 8px 10px;
      margin-bottom: 10px;
      max-height: 115px;
      overflow-y: auto;
    }
    .items-list li {
      padding: 3px 0;
      font-size: 11.5px;
      color: #D4D4D8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    .toggles-box {
      background: #121215;
      border: 1px solid #27272A;
      border-radius: 7px;
      padding: 9px 11px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: #A1A1AA;
      cursor: pointer;
    }
    .toggle-row input { accent-color: #0D9488; width: 14px; height: 14px; cursor: pointer; }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .btn {
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid #27272A;
      background: #18181B;
      color: #FAFAFA;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.12s;
    }
    .btn:hover { background: #27272A; border-color: #3F3F46; }
    .btn-teal {
      background: #0D9488;
      border-color: #0D9488;
      color: #FFF;
    }
    .btn-teal:hover { background: #0F766E; }
    .btn-full {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      background: #FAFAFA;
      border: 1px solid #FAFAFA;
      color: #09090B;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-full:hover { opacity: 0.9; }
    .status-msg {
      display: none;
      margin-bottom: 8px;
      padding: 6px 9px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10B981;
      font-size: 11.5px;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div>
        <div class="brand-title">DataLens</div>
        <div class="brand-sub mono">ufabc-gc5 · v2.0</div>
      </div>
    </div>
    <span id="risk-badge" class="badge badge-low mono">Auditando</span>
  </div>

  <div class="site-box">
    <div class="mono" style="font-size:10px; color:#71717A; text-transform:uppercase;">Origem da Aba Ativa</div>
    <div id="site-domain" class="domain-name mono">Carregando...</div>

    <div class="metrics-grid">
      <div class="metric-pill">
        <span id="cnt-ess" class="metric-val mono" style="color:#10B981;">0</span>
        <span class="metric-lbl">Essenciais</span>
      </div>
      <div class="metric-pill">
        <span id="cnt-ana" class="metric-val mono" style="color:#F59E0B;">0</span>
        <span class="metric-lbl">Analytics</span>
      </div>
      <div class="metric-pill">
        <span id="cnt-mkt" class="metric-val mono" style="color:#F97316;">0</span>
        <span class="metric-lbl">Marketing</span>
      </div>
      <div class="metric-pill">
        <span id="cnt-tp" class="metric-val mono" style="color:#EF4444;">0</span>
        <span class="metric-lbl">Terceiros</span>
      </div>
    </div>
  </div>

  <div class="section-title mono">Inventário Detectado na Página</div>
  <ul id="detected-list" class="items-list">
    <li>Inspecionando cookies e DOM...</li>
  </ul>

  <div id="status-msg" class="status-msg"></div>

  <div class="btn-group">
    <button id="btn-reject-clean" class="btn btn-teal">
      Rejeitar & Limpar
    </button>
    <button id="btn-show-card" class="btn">
      Síntese (5s) na Tela
    </button>
  </div>

  <div class="toggles-box">
    <label class="toggle-row">
      <span>Rejeitar cookies automaticamente</span>
      <input type="checkbox" id="chk-auto-reject" />
    </label>
    <label class="toggle-row">
      <span>Alerta em coleta de dado sensível</span>
      <input type="checkbox" id="chk-sensitive-alert" checked />
    </label>
    <label class="toggle-row">
      <span>Modo Silencioso (Suprimir avisos)</span>
      <input type="checkbox" id="chk-silent-mode" />
    </label>
  </div>

  <button id="btn-open-dashboard" class="btn-full">
    Abrir Inventário Completo (Dashboard) ↗
  </button>

  <script src="popup.js"></script>
</body>
</html>
